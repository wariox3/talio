# /etc/apache2/conf-available/semantica.conf
# Configuracion comun a todos los sitios del servidor.
# Activar con: a2enconf semantica

# Nombre del servidor: quita el aviso AH00558 al arrancar.
ServerName localhost

# No revelar version de Apache ni del sistema en cabeceras y paginas de error.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Nunca listar el contenido de un directorio sin index, en ningun sitio.
<Directory /var/www/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Archivos que no se sirven nunca, aunque un proyecto los deje bajo su
# DocumentRoot: ocultos (.env, .git, .htpasswd...) salvo .well-known (lo
# usa certbot), y respaldos o volcados.
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(bak|old|orig|swp|sql|log|dist|lock)$|~$">
    Require all denied
</FilesMatch>

# TLS: solo 1.2 y 1.3, cifrados que decide el cliente (todos son seguros).
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionTickets off

# Cabeceras de seguridad para todas las respuestas.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Tiempo maximo de una peticion (PHP-FPM incluido).
Timeout 120
ProxyTimeout 120

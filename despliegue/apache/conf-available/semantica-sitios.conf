# /etc/apache2/conf-available/semantica-sitios.conf
# Plantillas de sitio (mod_macro). Cada proyecto se declara en
# sites-available/<proyecto>.conf con una linea "Use ...".
# Activar con: a2enmod macro && a2enconf semantica-sitios
#
# Parametros:
#   $dominio  nombre del sitio, sin www (tambien responde con www.)
#   $raiz     carpeta publica, ruta absoluta (en Symfony, .../public)
#   $php      version de PHP-FPM: 8.3, 8.1... (tiene que estar instalada)
#   $cert     ruta del certificado sin extension: se usan $cert.crt,
#             $cert.key y $cert.ca_bundle

# Sitio PHP con HTTPS: HTTP redirige a HTTPS.
<Macro SitioPHP $dominio $raiz $php $cert>
    <VirtualHost *:80>
        ServerName $dominio
        ServerAlias www.$dominio
        Redirect permanent / https://$dominio/
    </VirtualHost>

    <VirtualHost *:443>
        ServerName $dominio
        ServerAlias www.$dominio
        DocumentRoot $raiz

        <Directory $raiz>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php$php-fpm.sock|fcgi://localhost"
        </FilesMatch>

        SSLEngine on
        SSLCertificateFile      $cert.crt
        SSLCertificateKeyFile   $cert.key
        SSLCertificateChainFile $cert.ca_bundle
        Header always set Strict-Transport-Security "max-age=31536000"

        ErrorLog  /var/log/apache2/$dominio-error.log
        CustomLog /var/log/apache2/$dominio-access.log combined
    </VirtualHost>
</Macro>

# /etc/apache2/sites-available/000-rechazar.conf
# Sitio por defecto: atiende lo que no coincide con ningun ServerName
# (peticiones por IP, dominios que no son nuestros, bots). Va primero (000-)
# para ser el default. Sin el, el 000-default de Ubuntu serviria
# /var/www/html entero, con los .env de todos los proyectos.
# Activar con: a2dissite 000-default && a2ensite 000-rechazar

<VirtualHost _default_:80>
    ServerName rechazar.invalid
    DocumentRoot /var/www/rechazar
    <Location />
        Require all denied
    </Location>
    ErrorLog  /var/log/apache2/rechazar-error.log
    CustomLog /var/log/apache2/rechazar-access.log combined
</VirtualHost>

<VirtualHost _default_:443>
    ServerName rechazar.invalid
    DocumentRoot /var/www/rechazar
    <Location />
        Require all denied
    </Location>
    # Hace falta un certificado para poder responder; sirve cualquiera.
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    ErrorLog  /var/log/apache2/rechazar-error.log
    CustomLog /var/log/apache2/rechazar-access.log combined
</VirtualHost>

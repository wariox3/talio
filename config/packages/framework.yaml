# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        # Jornada de trabajo. Los dos hacen falta y por separado: cookie_lifetime
        # es lo que el navegador guarda la cookie (0 = hasta cerrarlo) y
        # gc_maxlifetime lo que el servidor conserva los datos de la sesion. Sin
        # el segundo mandaria el php.ini, que trae los 1440 s de PHP por defecto,
        # y la sesion caducaria a los 24 minutos de inactividad con la cookie aun
        # viva.
        cookie_lifetime: 28800
        gc_maxlifetime: 28800
        # Directorio propio en vez del compartido del sistema
        # (/var/lib/php/sessions), para no depender del gc_maxlifetime de otras
        # apps: el cron de Debian aplica a todo el directorio el mayor valor que
        # encuentre entre los php.ini de las SAPIs. Fijar save_path hace que
        # Symfony use session.handler.native_file, que crea el directorio si no
        # existe. No va en cache_dir —el default de Symfony— porque un
        # cache:clear echaria a todo el mundo.
        save_path: '%kernel.project_dir%/var/sesiones'
        # Con un save_path propio, /usr/lib/php/sessionclean ya no limpia: ese
        # script solo mira el save_path de los php.ini, no el que la app fija en
        # tiempo de ejecucion. Y el recolector de PHP viene desactivado en Debian
        # (gc_probability = 0) justo porque delega en ese cron, asi que hay que
        # reactivarlo o los archivos se acumularian sin caducar nunca: 1 de cada
        # 100 peticiones hace la limpieza.
        gc_probability: 1
        gc_divisor: 100

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file